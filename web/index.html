<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>nginx-web</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <strong>nginx-web</strong>
          <small>Nginx 管理中心</small>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="主导航">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span><span>总览</span></button>
        <button class="nav-item" data-page="rules"><span class="nav-icon">⇄</span><span>代理规则</span></button>
        <button class="nav-item" data-page="certificates"><span class="nav-icon">◇</span><span>HTTPS 证书</span></button>
        <button class="nav-item" data-page="logs"><span class="nav-icon">≡</span><span>运行日志</span></button>
        <button class="nav-item" data-page="revisions"><span class="nav-icon">↶</span><span>配置历史</span></button>
        <button class="nav-item" data-page="config"><span class="nav-icon">{ }</span><span>Nginx 配置</span></button>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>设置</span></button>
      </nav>
      <div class="sidebar-footer">
        <div id="sidebar-status" class="mini-status"><span class="status-dot neutral"></span><span>正在连接…</span></div>
        <div class="version-row"><span id="app-version">v0.1.1</span><span id="nginx-version">Nginx 1.30.4</span></div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button id="mobile-menu" class="icon-button mobile-only" aria-label="打开菜单">☰</button>
        <div class="page-heading">
          <h1 id="page-title">总览</h1>
          <p id="page-subtitle">查看代理服务与配置状态</p>
        </div>
        <div class="top-actions">
          <button id="refresh-button" class="button ghost">刷新</button>
          <button id="test-button" class="button secondary">校验配置</button>
          <button id="apply-button" class="button primary">保存并应用</button>
        </div>
      </header>
      <main id="content" class="content" aria-live="polite">
        <div class="loading-panel"><div class="spinner"></div><p>正在读取 nginx-web 状态…</p></div>
      </main>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <div><h2 id="modal-title">编辑</h2><p id="modal-description"></p></div>
        <button id="modal-close" class="icon-button" aria-label="关闭">×</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
    </section>
  </div>

  <div id="confirm-backdrop" class="modal-backdrop hidden" aria-hidden="true">
    <section class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <header class="modal-header"><div><h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p></div></header>
      <footer class="modal-footer"><button id="confirm-cancel" class="button ghost">取消</button><button id="confirm-ok" class="button danger">确认</button></footer>
    </section>
  </div>

  <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  <script src="./app.js" defer></script>
</body>
</html>
