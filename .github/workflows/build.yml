name: FPK from pinned core
on:
  push:
    branches: [master, codex/split-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fpk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: make core
      - run: make build-all
      - name: Native fnOS lifecycle fixtures
        run: |
          sudo useradd --system --user-group --home-dir /nonexistent --shell /usr/sbin/nologin nginx-web
          version=$(python3 scripts/version.py)
          sudo ./tests/fpk-lifecycle.sh "dist/nginx-web-${version}-standard-x86_64.fpk"
          sudo ./tests/fpk-lifecycle.sh "dist/nginx-web-${version}-full-ports-x86_64.fpk"
          ./tests/install-restore.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fnos-packages
          path: |
            dist/*.fpk
            dist/*.sha256
